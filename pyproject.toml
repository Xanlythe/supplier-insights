[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "supplier-insights"
version = "0.1.0"
description = "Non-commercial, evidence-led corporate supply-chain exploration"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "followthemoney==3.8.2",
    "rigour==0.9.3",
    "countrynames>=1.13,<1.17",
    "httpx>=0.28,<1",
    "python-dotenv>=1,<2",
    "typer>=0.16,<1",
    "tzdata>=2025; sys_platform == 'win32'",
]

[project.scripts]
supplier-insights = "supplier_insights.cli:app"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
